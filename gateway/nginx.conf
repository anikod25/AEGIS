worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Limit request body to 10 MB — prevents oversized upload attacks
    client_max_body_size 10m;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # Hide Nginx version from error pages and headers
    server_tokens off;

    server {
        listen 80;
        server_name _;

        # -----------------------------------------------------------------------
        # Security headers — applied to every response
        # -----------------------------------------------------------------------
        add_header X-Content-Type-Options    "nosniff"                    always;
        add_header X-Frame-Options           "DENY"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "0"                          always;
        # Permissions-Policy: disable powerful APIs not needed by AEGIS
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # -----------------------------------------------------------------------
        # Gateway health check — no CORS, no caching
        # -----------------------------------------------------------------------
        location /health {
            access_log off;
            add_header Content-Type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"ok"}';
        }

        # -----------------------------------------------------------------------
        # API routes — proxy to FastAPI backend
        #
        # CORS is restricted to known origins. Update AEGIS_ORIGIN to the actual
        # deployed URL before going to production (e.g. https://aegis.example.com).
        # The wildcard "*" is intentionally NOT used — AEGIS uses Bearer tokens
        # so responses must not be available to every origin.
        # -----------------------------------------------------------------------
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }

        location /api/ {
            # CORS preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
                add_header Access-Control-Max-Age       3600 always;
                add_header Vary                         Origin always;
                return 204;
            }

            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Vary                         Origin always;

            # Cache control — API responses must not be cached by intermediaries
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;

            proxy_pass            http://backend:8000;
            proxy_http_version    1.1;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    120s;
            proxy_connect_timeout 30s;

            # Strip the server version header from proxied responses
            proxy_hide_header     Server;
        }

        # -----------------------------------------------------------------------
        # Frontend static files (React SPA)
        # -----------------------------------------------------------------------
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;

            # Content-Security-Policy for the React SPA.
            # 'unsafe-inline' is required for Vite's injected style tags.
            # Tighten this further once the build uses hashed styles.
            add_header Content-Security-Policy
                "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000 https://generativelanguage.googleapis.com; frame-ancestors 'none';"
                always;
        }
    }
}
