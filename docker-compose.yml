version: '3.9'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-aegis}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Restrict MySQL to the internal network only — never exposed to the host
    networks:
      - aegis_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    # Internal port only — traffic must come through the gateway
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    # Prevent the container from acquiring new privileges via setuid/setgid
    cap_drop:
      - ALL
    networks:
      - aegis_net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - aegis_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles:
      - build
    volumes:
      - frontend_dist:/output
    networks:
      - aegis_net

volumes:
  mysql_data:
  frontend_dist:

networks:
  aegis_net:
    driver: bridge
