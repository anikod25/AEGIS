apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-web
  namespace: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-web
  template:
    metadata:
      labels:
        app: aegis-web
    spec:
      imagePullSecrets:
        - name: aegis-dockerhub
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-web
  namespace: aegis
spec:
  type: NodePort
  selector:
    app: aegis-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
