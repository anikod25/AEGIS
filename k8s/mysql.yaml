apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aegis-mysql-data
  namespace: aegis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-mysql
  namespace: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: aegis-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: aegis
            - name: MYSQL_USER
              value: aegis
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: mysql-root-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: aegis-mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: aegis
spec:
  type: ClusterIP
  selector:
    app: aegis-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
