apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-backend
  namespace: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-backend
  template:
    metadata:
      labels:
        app: aegis-backend
    spec:
      imagePullSecrets:
        - name: aegis-dockerhub
      containers:
        - name: backend
          image: python:3.12-slim
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: mysql-password
            - name: DATABASE_URL
              value: "mysql+pymysql://aegis:$(MYSQL_PASSWORD)@mysql:3306/aegis"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: jwt-secret-key
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aegis
spec:
  type: ClusterIP
  selector:
    app: aegis-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
